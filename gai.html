
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Google Local Nano LLM </title>
	<link rel="stylesheet" href="gai.css">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
	<main class="app">
		<header class="app-header">
			<h1>Local AI Chat</h1>
			<div class="meta">Chrome Nano LLM</div>
			<div class="header-controls">
				<button id="newThreadBtn" class="new-thread" title="Start a new thread">New Thread</button>
			</div>
		</header>

		<section id="chat" class="chat">
			<div id="messages" class="messages"></div>
		</section>

		<form id="composer" class="composer" autocomplete="off">
			<textarea id="input" placeholder="Type a message and press Enter" rows="1"></textarea>
			<div class="controls">
				<button id="sendBtn" type="submit">Send</button>
				<button id="cancelBtn" type="button" hidden>Cancel</button>
			</div>
		</form>

		<div id="status" class="status" aria-live="polite"></div>
	</main>

    <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="gai.js"></script>
</body>
</html>
