
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Google AI Front End</title>
	<link rel="stylesheet" href="gai.css">
</head>
<body>
	<main class="app">
		<header class="app-header">
			<h1>AI Chat</h1>
			<div class="meta">Chrome 148 LLM frontend demo</div>
		</header>

		<section id="chat" class="chat">
			<div id="messages" class="messages"></div>
		</section>

		<form id="composer" class="composer" autocomplete="off">
			<textarea id="input" placeholder="Type a message and press Enter" rows="1"></textarea>
			<div class="controls">
				<button id="sendBtn" type="submit">Send</button>
				<button id="cancelBtn" type="button" hidden>Cancel</button>
			</div>
		</form>

		<div id="status" class="status" aria-live="polite"></div>
	</main>

	<script src="gai.js"></script>
</body>
</html>
